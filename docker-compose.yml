version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: mailflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mailflow
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - mailflow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mailflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mailflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/mailflow?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-token-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
      
      # Email Service (configure with your preferred provider)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@mailflow.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-MailFlow}
      
      # OpenAI for AI features
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4
      OPENAI_MAX_TOKENS: 1000
      
      # File upload limits
      MAX_FILE_SIZE: 10485760
      
      # Rate limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => { process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend (for production deployment)
  frontend:
    image: nginx:alpine
    container_name: mailflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - mailflow-network

  # Development frontend (uncomment for development)
  # frontend-dev:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   container_name: mailflow-frontend-dev
  #   restart: unless-stopped
  #   environment:
  #     REACT_APP_API_URL: http://localhost:8000/api
  #     CHOKIDAR_USEPOLLING: true
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend
  #   networks:
  #     - mailflow-network

  # Email testing service (MailHog for development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailflow-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - mailflow-network

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: mailflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mailflow-network
    profiles:
      - production

  # Database backup service
  mongodb-backup:
    image: mongo:7
    container_name: mailflow-mongodb-backup
    restart: "no"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/mailflow?authSource=admin
    volumes:
      - ./backups:/backups
      - ./docker/scripts/backup.sh:/backup.sh:ro
    depends_on:
      - mongodb
    networks:
      - mailflow-network
    profiles:
      - backup
    command: ["/backup.sh"]

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  mailflow-network:
    driver: bridge
    name: mailflow-network