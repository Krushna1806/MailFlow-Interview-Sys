version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mailflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mailflow
      MONGO_INITDB_ROOT_PASSWORD: mailflow123
      MONGO_INITDB_DATABASE: mailflow
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mailflow-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mailflow-network

  # Node.js Backend API
  backend-nodejs:
    build:
      context: ./backend/nodejs
      dockerfile: Dockerfile
    container_name: mailflow-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mailflow:mailflow123@mongodb:27017/mailflow?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-production-jwt-secret-here
      - FRONTEND_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/nodejs/.env:/app/.env
    networks:
      - mailflow-network

  # Python AI Service
  ai-service:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: mailflow-ai-service
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mailflow:mailflow123@mongodb:27017/mailflow_ai?authSource=admin
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/python/.env:/app/.env
    networks:
      - mailflow-network

  # Frontend Web Server
  frontend:
    image: nginx:alpine
    container_name: mailflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-nodejs
      - ai-service
    networks:
      - mailflow-network

volumes:
  mongodb_data:
  redis_data:

networks:
  mailflow-network:
    driver: bridge